version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/blackstork-io/blackstork-cli/plugin
plugins:
  - plugin: buf.build/protocolbuffers/go
    out: .
    opt: module=github.com/blackstork-io/blackstork-cli
  - plugin: buf.build/grpc/go
    out: .
    opt: module=github.com/blackstork-io/blackstork-cli
