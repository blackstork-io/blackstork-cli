on:
  workflow_call:

jobs:
  golangci-lint:
    permissions:
      # Required: allow read access to the content for analysis.
      contents: read
      # Optional: allow read access to pull request. Use with `only-new-issues` option.
      pull-requests: read
      # Optional: allow write access to checks to allow the action to annotate code in the PR.
      checks: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - id: golangci-rev
        name: Get the rev to compare against
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          echo "SHA=$(git merge-base origin/main @)" >> $GITHUB_OUTPUT

      - name: Lint pull request changes
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          only-new-issues: false
          args: "--new-from-rev ${{ steps.golangci-rev.outputs.SHA }}"

      - name: Lint repository
        if: github.event_name != 'pull_request'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          only-new-issues: false

  codegen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch all tags
        # checkout only gets the latest commit, so it has no tag info
        run: git fetch --depth=1 --tags

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: ./.github/workflows/install_tools

      - name: Regenerate code
        run: |
          ./codegen/rm_gen.sh
          ./codegen/gen.sh
      - name: Record generated changes
        run: git status --porcelain > "$RUNNER_TEMP/codegen-changes"
      - name: Format code
        run: |
          git restore --source=HEAD --staged --worktree .
          git clean -fd
          ./codegen/format.sh

      - name: Verify that code is correctly generated and formatted
        run: |
          codegen_changes=$(cat "$RUNNER_TEMP/codegen-changes")
          format_changes=$(git status --porcelain)
          if [ -n "$codegen_changes" ] || [ -n "$format_changes" ]; then
            echo "Generated or formatted files are not up to date:" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$codegen_changes" ]; then
              printf '%s\n' "$codegen_changes" | sed 's/^/* generated: /' >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ -n "$format_changes" ]; then
              printf '%s\n' "$format_changes" | sed 's/^/* formatted: /' >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::error title=Generated files are stale::Run ./codegen/gen.sh and ./codegen/format.sh"
            exit 1
          fi

  lint-protobuf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: ./.github/workflows/install_tools

      - name: Lint protobuf files
        run: ./codegen/lint_protobuf.sh

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.10 .github/workflows/*.yml
