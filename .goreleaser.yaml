changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - name: blackstork-cli
    ids:
      - blackstork-cli
    description: "A source-available, headless execution engine for BlackStork templates. It automates cybersecurity and compliance reporting by generating Markdown, HTML and PDF reports from structured data using modular declarative templates."
    homepage: "https://blackstork.io/cli/"
    license: BUSL-1.1
    repository:
      owner: blackstork-io
      name: homebrew-tools
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"

release:
  extra_files:
    - glob: ./.tmp/plugins.json
  prerelease: auto
