syntax = "proto3";

package pluginapi.v1;

import "pluginapi/v1/data.proto";

message ContentProviderResult {
    Content content  = 1;
}

message Content {
    oneof value {
        ContentElement element = 1;
        ContentSection section = 2;
    };
}

message BlockDetails {
    string kind = 1;
    string runner = 2;
    string name = 3;
    string id = 4;
    uint32 depth = 5;
}

message ExecDetails {
    string plugin_name = 1;
    string plugin_version = 2;
    string runner = 3;
}

message ContentSection {
    BlockDetails block_details = 1;
    MapData meta = 2;
    optional Content title = 3;
    repeated Content children = 4;
    bytes id = 5;
}

message ContentElement {
    BlockDetails block_details = 1;
    ExecDetails  exec_details = 2;
    MapData meta = 3;

    string kind = 4;

    MapData attrs = 5;
    MapData data_context = 6;

    bytes id = 7;
}

message FormattedContent {
    MapData meta = 1;
    ExecDetails exec_details = 2;
    string format = 3;
    bytes content = 4;
}
