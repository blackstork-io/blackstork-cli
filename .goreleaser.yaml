version: 2

project_name: blackstork-cli

env:
  - CGO_ENABLED=0

before:
  hooks:
    - go mod tidy
    - go run ./tools/pluginmeta --namespace blackstork --version {{.Version}}

builds:
  # CLI

  - id: blackstork-cli
    main: .
    binary: blackstork-cli
    flags: "-trimpath"
    ldflags:
      - -s -w
      - -X github.com/blackstork-io/blackstork-cli/cmd.version={{.Version}}
      - -X github.com/blackstork-io/blackstork-cli/cmd.builtBy=goreleaser

    targets:
      - linux_amd64_v1
      - linux_arm64 # implicitly v8
      - darwin_amd64_v1
      - darwin_arm64
      - windows_amd64_v1
      - windows_arm64


  # Plugins
  # TODO: generate this list with custom script or use Premium goreleaser to template it

  - id: plugin_elastic
    main: ./plugins/elastic/cmd
    binary: "elastic@{{ .Version }}"
    flags: "-trimpath"
    hooks:
      post:
        - go run ./tools/pluginmeta --namespace blackstork --version {{.Version}} patch --plugin {{.Path}} --os {{.Os}} --arch {{.Arch}}
    goos:
      - linux
      - windows
      - darwin
    tags:
      - blackstorkplugin

  - id: plugin_eclecticiq
    main: ./plugins/eclecticiq/cmd
    binary: "eclecticiq@{{ .Version }}"
